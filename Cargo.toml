[package]
# The game is "Amoeba Roguelike Remastered"; the crate, the binary, the wasm
# filename and the published URL all stay `amoeba-rl` so nothing already
# deployed has to move. Only the name on the tin changed.
name = "amoeba-rl"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Cassidy Prather <pratherea@gmail.com>"]
description = "Amoeba Roguelike Remastered: play as a giant, constantly evolving amoeba - a Rust remaster of the 7DRL roguelike"
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CassidyPrather/amoeba_rl"
keywords = ["game", "roguelike", "macroquad", "wasm", "7drl"]
categories = ["games", "wasm"]
publish = false

[lib]
name = "amoeba_rl"
path = "src/lib.rs"

[[bin]]
name = "amoeba-rl"
path = "src/main.rs"

[[bench]]
name = "sim_bench"
harness = false

[dependencies]
# `audio` is off in macroquad's default features; the web build also needs
# quad-snd's audio.js plugin in web/ (see CREDITS.md). It costs ~300 bytes of
# wasm: on the web quad-snd is a few extern declarations and the browser does
# the decoding, so the heavy native decoders never reach this target.
macroquad = { version = "0.4", features = ["audio"] }
fastrand = "2"

[dev-dependencies]
criterion = "0.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Turn everything up. I'm not a coward!
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Targeted allows (each one earns its place, like the ruff ignores did)
multiple_crate_versions = "allow" # Transitive deps disagree; not actionable here
missing_errors_doc = "allow" # Undocumented stuff is fine (the D10 of clippy)
missing_panics_doc = "allow" # Ditto
cast_precision_loss = "allow" # usize -> f32 in render math; the counts are tiny
cast_possible_truncation = "allow" # f32 -> i32 for pixel/window sizes is the point

[profile.release]
# Smaller, faster binaries at the cost of compile time
lto = "thin"
strip = "symbols"
