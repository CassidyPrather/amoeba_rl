    <title>Amoeba Roguelike Remastered has moved</title>

         location.replace keeps this page out of the back button. -->

    <script>location.replace("/game-prototypes/");</script>
</head>
<body>
    <p>Amoeba Roguelike Remastered now lives with the other games:
    <a href="/game-prototypes/">wirenook.net/game-prototypes</a>.</p>
